# Sadran is a static site with no build step: Netlify publishes the site/ folder as it is.
[build]
  publish = "site"

# Security headers for every file. The page's own Content-Security-Policy (what may load and
# where data may go) is in site/index.html, so it also applies on any other host. The headers a
# page cannot set for itself are here: HTTPS only, and no embedding in other sites.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
