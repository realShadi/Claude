<!doctype html>
<html lang="he" dir="rtl">

<body>
<a class="skip" href="#view" data-act="skip">דילוג לתוכן הראשי</a>
<div class="app" id="app" dir="rtl" lang="he">
  <div id="cookieRoot"></div>
  <header class="bar">
    <div class="bar-in">
      <a class="brand" id="brandLink" href="./" data-act="home">
        <img class="brand-logo" id="brandLogo" alt="" hidden>
        <span class="brand-mark" id="brandMark">סדרן</span>

      </a>
      <nav class="tabs-top" id="tabsTop" aria-label="ניווט ראשי"></nav>
      <div class="sess" id="sess"></div>
      <button type="button" class="bar-btn" id="appearBtn" data-act="appearance" hidden></button>
    </div>
  </header>
  <main class="main" id="view" tabindex="-1"></main>
  <footer class="foot" id="foot"></footer>
  <nav class="tabs-bottom" id="tabsBottom" aria-label="ניווט ראשי"></nav>
  <div id="sheetRoot"></div>
  <div class="toast-root" id="toastRoot" aria-live="polite"></div>
  <div class="vh" id="routeStatus" aria-live="polite"></div>
  <input type="file" id="xlsxFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-label="קובץ אקסל של עובדים" hidden>
  <input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/gif" aria-label="קובץ הלוגו של החנות" hidden>
