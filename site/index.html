<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>סדרן משמרות</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Secular+One&display=swap">
<style>
/* Layout: a sticky app bar, a week toolbar, then the roster. On phones the roster is a stack of
   day sections with bottom tabs; from 1000px it becomes one right-to-left week sheet of seven
   columns with shifts aligned in rows. Roles are marked like highlighter on a printed roster. */
:root {
  --bg: #ECEFF3;
  --surface: #FFFFFF;
  --surface-2: #F3F5F8;
  --ink: #131C29;
  --ink-2: #445162;
  --ink-3: #647182;
  --line: #DCE1E8;
  --line-2: #BDC6D1;
  --accent: #2343D0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4E9FB;
  --ok: #17794A;
  --ok-soft: #DAF2E4;
  --warn: #8A5000;
  --warn-soft: #FCECC8;
  --bad: #BE2A1E;
  --bad-soft: #FBE3E0;
  --hl-1: #FFE55C;
  --hl-2: #FFB6D3;
  --hl-3: #B7EDA3;
  --hl-4: #A8DDFA;
  --hl-5: #FFCB8F;
  --hl-6: #D6C8FF;
  --scrim: rgba(19, 28, 41, .46);
  --shadow: 0 12px 40px rgba(19, 28, 41, .2);
  --font-display: "Secular One", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
  --font-body: "IBM Plex Sans Hebrew", "Segoe UI", "Arial Hebrew", "Noto Sans Hebrew", Arial, sans-serif;
  --bar-h: 56px;
  --tabs-h: 60px;
  direction: rtl;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1319;
    --surface: #182029;
    --surface-2: #1F2933;
    --ink: #E9EEF3;
    --ink-2: #B5C0CC;
    --ink-3: #8D9AA8;
    --line: #2A3642;
    --line-2: #3E4C5A;
    --accent: #8AA5FF;
    --accent-ink: #0A1230;
    --accent-soft: #1E2B57;
    --ok: #63D397;
    --ok-soft: #143524;
    --warn: #F2BA5C;
    --warn-soft: #3D2D0C;
    --bad: #FF8E82;
    --bad-soft: #471A1B;
    --hl-1: #5E5108;
    --hl-2: #6C2446;
    --hl-3: #24562B;
    --hl-4: #154A67;
    --hl-5: #6C4412;
    --hl-6: #44367C;
    --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 12px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1319;
  --surface: #182029;
  --surface-2: #1F2933;
  --ink: #E9EEF3;
  --ink-2: #B5C0CC;
  --ink-3: #8D9AA8;
  --line: #2A3642;
  --line-2: #3E4C5A;
  --accent: #8AA5FF;
  --accent-ink: #0A1230;
  --accent-soft: #1E2B57;
  --ok: #63D397;
  --ok-soft: #143524;
  --warn: #F2BA5C;
  --warn-soft: #3D2D0C;
  --bad: #FF8E82;
  --bad-soft: #471A1B;
  --hl-1: #5E5108;
  --hl-2: #6C2446;
  --hl-3: #24562B;
  --hl-4: #154A67;
  --hl-5: #6C4412;
  --hl-6: #44367C;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 12px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
body.has-sheet { overflow: hidden; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.t { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ic { width: 20px; height: 20px; flex: none; }
.h1 { font: 400 1.5rem/1.2 var(--font-display); text-wrap: balance; }
.h2 { font: 400 1.1875rem/1.25 var(--font-display); text-wrap: balance; }
.sub { color: var(--ink-3); font-size: .875rem; }
.stack { display: grid; gap: 14px; }
.stack > * { min-width: 0; }

/* ---------- app bar ---------- */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 1360px;
  margin: 0 auto;
  height: var(--bar-h);
  display: flex;
  align-items: center;
  gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand-mark {
  font: 400 1.5rem/1.15 var(--font-display);
  padding: 0 5px;
  background: linear-gradient(transparent 52%, var(--hl-1) 52%, var(--hl-1) 90%, transparent 90%);
  border-radius: 2px;
}
.brand-store {
  color: var(--ink-3);
  font-size: .875rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.sess { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.sess-who { display: grid; justify-items: end; min-width: 0; line-height: 1.2; }
.sess-n { max-width: 8.5rem; font-size: .875rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess-r { font-size: .6875rem; font-weight: 600; color: var(--ink-3); }
.sess-out {
  flex: none;
  min-height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  font-size: .8125rem;
  font-weight: 600;
}
.seg {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  padding: 3px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 13px;
}
.seg-b {
  border: 0;
  background: none;
  min-height: 40px;
  border-radius: 10px;
  font-size: .9375rem;
  font-weight: 600;
  color: var(--ink-2);
}
.seg-b[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* ---------- tabs ---------- */
.tabs-top { display: none; gap: 2px; margin-inline-start: 12px; }
.tabs-bottom {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 20;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tab {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: var(--tabs-h);
  border: 0;
  background: none;
  color: var(--ink-3);
  font-size: .75rem;
  font-weight: 600;
}
.tab[aria-current="page"] { color: var(--accent); }
.tab .ic { width: 22px; height: 22px; }
.badge {
  position: absolute;
  top: 7px;
  inset-inline-start: calc(50% + 6px);
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 99px;
  background: var(--bad);
  color: var(--surface);
  font: 700 .6875rem/17px var(--font-body);
  font-style: normal;
  text-align: center;
}
@media (min-width: 900px) {
  .tabs-bottom { display: none; }
  .tabs-top { display: flex; }
  .tabs-top .tab {
    flex: none;
    flex-direction: row;
    gap: 7px;
    min-height: 38px;
    padding: 0 12px;
    border-radius: 9px;
    font-size: .9375rem;
  }
  .tabs-top .tab[aria-current="page"] { background: var(--accent-soft); }
  .tabs-top .tab .ic { width: 18px; height: 18px; }
  .tabs-top .badge { position: static; }
}

/* ---------- page ---------- */
.main {
  max-width: 1360px;
  margin: 0 auto;
  display: grid;
  gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--tabs-h) + 32px);
}
.main > * { min-width: 0; }
.main.is-narrow { max-width: 780px; }
@media (min-width: 900px) { .main { padding-block: 22px 56px; } }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
}
.pagehead { display: flex; align-items: center; gap: 12px; }
.pagehead > :first-child { flex: 1; min-width: 0; }

/* ---------- buttons, chips, banners ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 11px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  font-weight: 600;
  font-size: .9375rem;
  white-space: nowrap;
}
.btn .ic { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--accent); }
.btn-danger { color: var(--bad); }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn-icon { width: 44px; padding: 0; flex: none; }
.btn-block { width: 100%; }
.confirm { display: inline-flex; gap: 8px; flex-wrap: wrap; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: .8125rem;
  font-weight: 600;
}
.chip .ic { width: 14px; height: 14px; }
.chip-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.tag { font-size: .75rem; font-weight: 700; }
.tag-ok { color: var(--ok); }
.tag-warn { color: var(--warn); }

.banner {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 10px 12px;
  border-radius: 11px;
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: .875rem;
}
.banner > span { flex: 1; min-width: 0; }
.banner .ic { width: 18px; height: 18px; margin-top: 1px; }
.banner-ok { background: var(--ok-soft); color: var(--ok); }
.banner-warn { background: var(--warn-soft); color: var(--warn); }
.banner-x {
  border: 0;
  background: none;
  padding: 0;
  width: 28px;
  height: 28px;
  margin: -4px;
  display: grid;
  place-items: center;
  border-radius: 8px;
}

/* role marks: highlighter over the role name */
.role {
  display: inline-block;
  max-width: 100%;
  padding: 1px 7px 2px;
  font-size: .8125rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: middle;
  border-radius: 4px 9px 5px 10px / 9px 4px 10px 5px;
  background: linear-gradient(var(--hl, var(--line)), var(--hl, var(--line))) no-repeat right center / 100% 100%;
}
.hl-1 { --hl: var(--hl-1); }
.hl-2 { --hl: var(--hl-2); }
.hl-3 { --hl: var(--hl-3); }
.hl-4 { --hl: var(--hl-4); }
.hl-5 { --hl: var(--hl-5); }
.hl-6 { --hl: var(--hl-6); }
.hl-7 { --hl: var(--hl-7); }
.hl-8 { --hl: var(--hl-8); }
.hl-9 { --hl: var(--hl-9); }
.hl-10 { --hl: var(--hl-10); }
.hl-11 { --hl: var(--hl-11); }
.hl-12 { --hl: var(--hl-12); }
@keyframes swipe { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
.is-fresh .role { animation: swipe .5s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 14ms); }

/* ---------- week toolbar ---------- */
.wk-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.weeknav { display: flex; align-items: center; gap: 4px; }
.weeknav-l {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 9rem;
  padding: 2px 8px;
  border: 0;
  border-radius: 10px;
  background: none;
  line-height: 1.2;
}
.weeknav-k { font-size: .75rem; font-weight: 600; color: var(--ink-3); }
.weeknav-d { font: 400 1.5rem/1.15 var(--font-display); }
.wk-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-inline-start: auto; }
@media (max-width: 599px) {
  .weeknav { width: 100%; justify-content: space-between; }
  .wk-actions { width: 100%; margin: 0; }
  .wk-actions .btn-primary { flex: 1; }
}

/* ---------- summary ---------- */
.sum { display: grid; gap: 12px; }
.sum-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.sum-num { display: flex; align-items: baseline; gap: 8px; }
.num { font: 400 2rem/1 var(--font-display); }
.meter {
  flex: 1 1 140px;
  height: 9px;
  border-radius: 99px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  overflow: hidden;
}
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
.fold > summary {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 32px;
  cursor: pointer;
  list-style: none;
  font-size: .875rem;
  font-weight: 600;
  color: var(--ink-2);
}
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before {
  content: "";
  width: 7px;
  height: 7px;
  margin-inline: 3px;
  border-left: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(45deg);
}
.fold[open] > summary::before { transform: rotate(-45deg) translate(1px, -2px); }
.load-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: 10px 18px;
  padding-top: 8px;
}
.load-i { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; font-size: .8125rem; }
.load-n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.load-c { color: var(--ink-3); font-weight: 600; }
.load-bar { grid-column: 1 / -1; height: 5px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.load-bar i { display: block; height: 100%; border-radius: 9px; background: var(--accent); }
.load-i.is-over .load-bar i { background: var(--bad); }
.load-i.is-over .load-c { color: var(--bad); }
.load-i.is-ns .load-n { color: var(--ink-3); font-weight: 500; }

/* ---------- day strip (phones) ---------- */
.daystrip {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + var(--bar-h));
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  padding: 6px 0;
  margin-block: -6px;
  background: var(--bg);
}
.dchip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 5px 0 6px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  font-size: .875rem;
  font-weight: 700;
  line-height: 1.2;
}
.dchip small { font-size: .6875rem; font-weight: 500; color: var(--ink-3); }
.dchip i { width: 6px; height: 6px; margin-top: 2px; border-radius: 50%; background: var(--ok); }
.dchip.is-miss i { background: var(--bad); }
.dchip.is-off { background: transparent; color: var(--ink-3); }
.dchip.is-off i { background: var(--line-2); }
@media (min-width: 1000px) { .daystrip { display: none; } }

/* ---------- week sheet ---------- */
.week { display: grid; gap: 18px; }
.day {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 8px;
  min-width: 0;
  scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 74px);
}
.day-h { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.day-n { font: 400 1.1875rem/1.2 var(--font-display); }
.day-d { color: var(--ink-3); font-size: .875rem; }
.day-s { margin-inline-start: auto; font-size: .8125rem; font-weight: 700; white-space: nowrap; }
.day-s.is-ok { color: var(--ok); }
.day-s.is-miss { color: var(--bad); }
.day-s.is-off { color: var(--ink-3); font-weight: 500; }
.day.is-today .day-n { background: linear-gradient(transparent 55%, var(--hl-1) 55%, var(--hl-1) 92%, transparent 92%); }
.shift {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.shift-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; padding: 9px 12px 8px; }
.shift-n { font-weight: 700; }
.shift-t { color: var(--ink-3); font-size: .8125rem; }
.shift-c { margin-inline-start: auto; font-size: .8125rem; font-weight: 700; color: var(--ok); }
.shift-c.is-miss { color: var(--bad); }
.shift.is-closed {
  flex-direction: row;
  align-items: baseline;
  gap: 8px;
  padding: 9px 12px;
  background: transparent;
  border-style: dashed;
  border-color: var(--line-2);
  color: var(--ink-3);
  font-size: .875rem;
}
.shift.is-closed .shift-n { font-weight: 600; }
.pos {
  display: grid;
  grid-template-columns: 7.25rem minmax(0, 1fr) auto;
  grid-template-areas: "role who x";
  align-items: center;
  gap: 2px 10px;
  width: 100%;
  min-height: 46px;
  padding: 6px 12px;
  border: 0;
  border-top: 1px solid var(--line);
  background: none;
  text-align: start;
}
.pos .role { grid-area: role; justify-self: start; }
.pos-who { grid-area: who; display: grid; min-width: 0; line-height: 1.3; }
.pos-n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos-w { display: flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 600; color: var(--warn); }
.pos-w .ic { width: 13px; height: 13px; }
.pos-x { grid-area: x; display: flex; color: var(--ink-3); }
.pos-x .ic { width: 16px; height: 16px; }
button.pos:hover { background: var(--surface-2); }
.pos.is-empty { background: var(--bad-soft); }
.pos.is-empty .pos-n { color: var(--bad); }
.pos.is-empty .pos-x { color: var(--bad); }
button.pos.is-empty:hover { background: var(--bad-soft); filter: brightness(.97); }
.pos.is-me { background: var(--accent-soft); }
.add-pos {
  margin-top: auto;
  min-height: 38px;
  padding: 0 12px;
  border: 0;
  border-top: 1px dashed var(--line-2);
  background: none;
  color: var(--ink-3);
  font-size: .8125rem;
  font-weight: 600;
  text-align: start;
}
.add-pos:hover { color: var(--accent); }
@media (max-width: 999px) {
  .day.is-off .shift { display: none; }
}
@media (min-width: 1000px) {
  .week { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px 10px; }
  .day { grid-template-columns: minmax(0, 1fr); grid-template-rows: subgrid; grid-row: span var(--rows, 3); }
  .day-h { flex-wrap: wrap; padding-bottom: 2px; border-bottom: 2px solid var(--ink); }
  .pos {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "role x" "who who";
    padding: 7px 10px 8px;
  }
}

/* ---------- availability (employee editor) ---------- */
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.who-l { font-size: .875rem; font-weight: 600; color: var(--ink-2); }

function load() {

// Bring data saved by the first version up to date: sign-in numbers, a manager code, a session.
function migrate(s) {
  if (s.v === 1) { s.example = true; s.v = 2; }
  s.prefs = s.prefs || { demoNote: true };
  delete s.prefs.mode;
  delete s.prefs.me;
  if (!s.prefs.session) s.prefs.session = null;
  if (!s.theme) s.theme = { preset: 'blue' };
  if (!s.exportStyle) s.exportStyle = 'color';
  s.rules = Object.assign({ minRest: 10 }, s.rules);
  if (!s.rules.deadline) s.rules.deadline = DEF_DEADLINE();
  if (!s.managerCode) s.managerCode = DEMO_CODE;
  const used = new Set(s.employees.map(e => e.number).filter(Boolean));
  let next = 1001;
  for (const e of s.employees) {
    if (e.number) continue;
    while (used.has(String(next)) || String(next) === s.managerCode) next++;
    e.number = String(next);
    used.add(e.number);
  }
  return s;
}

      for (let i = 0; i < n; i++) list.push(have[i] ? { role: r.id, emp: have[i].emp, lock: !!have[i].lock } : { role: r.id, emp: null, lock: false });
    }
    next[k] = list;
  }
  w.slots = next;

}
function empShifts(w, empId, except) {
  const out = [];
  for (const k in w.slots) {
    const list = w.slots[k];
    for (let i = 0; i < list.length; i++) {
      if (list[i].emp !== empId) continue;
      if (except && except.k === k && except.i === i) continue;
      const u = unsk(k);

}
function span(d, shId) {

/* ---------- availability values ----------
   A shift is 1 (can), 2 (prefers), or { v: 1|2, t: [[from, to], ...] } for part of it (up to two
   ranges). A null end of a range means the start or end of the shift, so it follows shift changes. */
const slotV = x => (x && typeof x === 'object' ? (x.v === 2 ? 2 : 1) : x === 2 ? 2 : x ? 1 : 0);
const slotT = x => (x && typeof x === 'object' && Array.isArray(x.t) && x.t.length ? x.t : null);

  const rec = availRec(wk, empId);
  return rec ? rangesText(rec.slots[k], shiftById(unsk(k)[1])) : '';
}

// Everything that stands in the way of placing `emp` in a position. Empty list = a clean fit.
function issues(wk, d, shId, roleId, emp, self) {
  const w = state.weeks[wk], out = [], k = sk(d, shId);
  if (!emp.roles.includes(roleId)) out.push('norole');
  const av = availRec(wk, emp.id);
  if (!av || !av.submittedAt) out.push('nosubmit');
  else if (!av.slots[k]) out.push('unavail');
  else if (slotT(av.slots[k])) out.push('partial');
  const mine = empShifts(w, emp.id, self);
  if (mine.some(m => m.k === k)) out.push('inslot');
  else if (mine.some(m => restClash(m.d, m.sh, d, shId))) out.push('rest');
  if (mine.length + 1 > emp.max) out.push('max');
  return out;
}
const ISSUE_SHORT = { norole: 'לא בתפקיד', nosubmit: 'לא הוגשה זמינות', unavail: 'לא זמין/ה', rest: 'מנוחה קצרה', inslot: 'כפול במשמרת', partial: 'זמינות חלקית' };
function issueText(z, e, hours) {
  if (z === 'partial') return hours ? 'זמין/ה רק ב־' + ltr(hours) : 'זמין/ה רק בחלק מהמשמרת';
  if (z === 'norole') return 'לא מוגדר/ת לתפקיד הזה';
  if (z === 'nosubmit') return 'טרם הגיש/ה זמינות';
  if (z === 'unavail') return 'לא זמין/ה במשמרת הזו';
  if (z === 'inslot') return 'כבר משובץ/ת במשמרת הזו';
  if (z === 'rest') return state.rules.minRest ? 'פחות מ־' + state.rules.minRest + ' שעות מנוחה ממשמרת סמוכה' : 'חופף למשמרת אחרת';
  return 'מעבר למקסימום (' + e.max + ' משמרות)';
}

/* ---------- automatic scheduling ----------
   Each attempt is greedy, most-constrained position first; a pick favours people who asked for
   the shift and people with the lightest load, and a short swap search then tries to close the
   leftover gaps. Several randomized attempts run and the best roster is kept. */
function autoSchedule(wk, fillOnly) {
  const w = syncWeek(wk);
  if (!fillOnly) for (const k in w.slots) for (const p of w.slots[k]) if (!p.lock) p.emp = null;
  const base = JSON.stringify(w.slots);
  const fits = (e, p) => issues(wk, p.d, p.sh, p.role, e, p).length === 0;
  const cands = p => state.employees.filter(e => fits(e, p));
  const score = (e, p) => {
    const load = empShifts(w, e.id).length;
    const pref = slotV(state.avail[wk][e.id].slots[p.k]) === 2 ? 2 : 0;
    return pref + (1 - load / e.max) * 3 - (e.roles.length - 1) * 0.6 + Math.random() * 0.8;
  };
  const pick = (p, list) => list.map(e => [score(e, p), e]).sort((a, b) => b[0] - a[0])[0][1];
  const put = (p, id) => { w.slots[p.k][p.i].emp = id; };
  const id = p => p.k + '#' + p.i;
  function tryFill(p, depth, chain) {
    const c = cands(p);
    if (c.length) { put(p, pick(p, c).id); return true; }
    if (depth <= 0) return false;
    chain.add(id(p));
    for (const e of state.employees) {
      const is = issues(wk, p.d, p.sh, p.role, e, p);
      if (!is.length || is.some(z => z !== 'max' && z !== 'rest')) continue;
      for (const q of empShifts(w, e.id)) {
        const qp = w.slots[q.k][q.i];
        if (qp.lock || chain.has(id(q))) continue;
        qp.emp = null;
        if (fits(e, p)) {
          put(p, e.id);
          if (tryFill({ k: q.k, i: q.i, d: q.d, sh: q.sh, role: qp.role }, depth - 1, chain)) { chain.delete(id(p)); return true; }
          put(p, null);
        }
        qp.emp = e.id;
      }
    }
    chain.delete(id(p));
    return false;
  }
  function attempt() {
    const open = [], unfilled = [];
    for (const k in w.slots) w.slots[k].forEach((p, i) => { if (!p.emp) { const u = unsk(k); open.push({ k, i, d: u[0], sh: u[1], role: p.role }); } });
    while (open.length) {
      let bi = 0, bc = null;
      for (let i = 0; i < open.length; i++) {
        const c = cands(open[i]);
        if (!bc || c.length < bc.length || (c.length === bc.length && Math.random() < 0.25)) { bi = i; bc = c; }
        if (!c.length) break;
      }
      const p = open.splice(bi, 1)[0];
      if (bc.length) put(p, pick(p, bc).id); else unfilled.push(p);
    }
    if (!fillOnly) for (const p of unfilled) tryFill(p, 2, new Set());
  }
  // Coverage first, then granted preferences, then an even spread of the load.
  function quality() {
    let filled = 0, prefs = 0;
    const load = {};
    for (const k in w.slots) for (const p of w.slots[k]) {
      if (!p.emp) continue;
      filled++;
      load[p.emp] = (load[p.emp] || 0) + 1;
      const av = availRec(wk, p.emp);
      if (av && av.slots[k] === 2) prefs++;
    }
    let spread = 0;
    for (const e of state.employees) spread += Math.pow((load[e.id] || 0) / e.max, 2);
    return filled * 100 + prefs * 2 - spread * 10;
  }
  let best = base, bestQ = -Infinity;
  for (let t = 0; t < (fillOnly ? 8 : 20); t++) {
    w.slots = JSON.parse(base);
    attempt();
    const q = quality();
    if (q > bestQ) { bestQ = q; best = JSON.stringify(w.slots); }
  }
  w.slots = JSON.parse(best);
}

function weekStats(wk, slots) {
  let total = 0, filled = 0, warns = 0;
  const count = {};
  for (const k in slots) {
    const u = unsk(k);
    slots[k].forEach((p, i) => {
      total++;
      if (!p.emp) return;
      filled++;
      count[p.emp] = (count[p.emp] || 0) + 1;
      const e = empById(p.emp);
      if (e && issues(wk, u[0], u[1], p.role, e, { k, i }).some(z => z !== 'max')) warns++;
    });
  }
  for (const e of state.employees) if ((count[e.id] || 0) > e.max) warns++;
  return { total, filled, missing: total - filled, warns, count };
}
const sig = slots => JSON.stringify(Object.keys(slots).sort().map(k => [k, slots[k].map(p => [p.role, p.emp])]));

function coverageRisks(wk) {
  const out = [];
  for (let d = 0; d < 7; d++) for (const sh of state.shifts) {
    const k = sk(d, sh.id), req = required(wk, d, sh.id);
    for (const roleId in req) {
      const have = state.employees.filter(e => e.roles.includes(roleId) && isSubmitted(wk, e.id) && fullAvail(availRec(wk, e.id).slots[k])).length;
      if (have < req[roleId]) out.push({ d, sh, roleId, have, need: req[roleId] });
    }
  }
  return out;
}

  const rows = emps.map(e => {
    const rec = availRec(wk, e.id), sub = rec && rec.submittedAt;
    return '<tr class="' + (sub ? '' : 'is-ns') + '"><th class="mx-name"><button type="button" class="mx-btn" id="mx-' + e.id + '" data-act="editAvail" data-emp="' + e.id + '">' + esc(e.name) + '</button></th>' +
      days.map(d => '<td><span class="cells">' + state.shifts.map(sh => {
        const k = sk(d, sh.id);
        if (state.closed[k]) return '<i class="c cx" title="סגור"></i>';
        if (!sub) return '<i class="c cq" title="טרם הוגש"></i>';
        const x = rec.slots[k], v = slotV(x), part = slotT(x);
        return '<i class="c c' + v + (part ? ' cp' : '') + '" title="' + dayTitle(d) + ' ' + esc(sh.name) + ': ' + (part ? 'חלקי, ' + esc(rangesText(x, sh)) : ['לא', 'אפשר', 'מועדף'][v]) + '"></i>';
      }).join('') + '</span></td>').join('') + '</tr>';
  }).join('');
  const foot = '<tr><th class="mx-name">זמינים</th>' + days.map(d => '<td><span class="cells">' + state.shifts.map(sh => {
    const k = sk(d, sh.id), req = required(wk, d, sh.id);
    const need = Object.values(req).reduce((a, b) => a + b, 0);
    if (!need) return '<i class="cn is-off">·</i>';
    const have = emps.filter(e => isSubmitted(wk, e.id) && fullAvail(availRec(wk, e.id).slots[k])).length;
    return '<i class="cn' + (have < need ? ' is-bad' : '') + '" title="' + have + ' זמינים, ' + need + ' נדרשים">' + have + '</i>';
  }).join('') + '</span></td>').join('') + '</tr>';
  const risks = coverageRisks(wk);
  const order = state.shifts.map(sh => esc(sh.name)).join(', ');
  return '<section class="wk-head">' + weekNav() + '</section>' +
    '<section class="card stack">' +
    '<div class="sum-top"><div class="sum-num"><span class="num t">' + (emps.length - pending.length) + '/' + emps.length + '</span><span class="sub">עובדים הגישו זמינות</span></div>' +
    (pending.length ? '<div class="acts">' + (REMOTE ? '<button type="button" class="btn btn-primary" id="btnRemindNow" data-act="remindNow"' + (net.busy ? ' disabled' : '') + '>' + icon('bell') + 'שליחת התראה</button>' : '') +
      '<button type="button" class="btn" id="btnRemind" data-act="remind">' + icon('copy') + 'הודעת תזכורת</button></div>' : '') + '</div>' +
    (deadlineOf(wk) ? '<p class="sub">מועד אחרון להגשה: ' + deadlineText(deadlineOf(wk)) + (Date.now() > deadlineOf(wk).getTime() ? ' (עבר)' : '') + '</p>' : '') +
    (pending.length ? '<p class="banner banner-warn">' + icon('alert') + '<span>טרם הגישו: ' + pending.map(e => esc(e.name)).join(', ') + '. אפשר להקיש על שם בטבלה ולמלא בשמם.</span></p>'
      : (emps.length ? '<p class="banner banner-ok">' + icon('check') + '<span>כל הצוות הגיש זמינות לשבוע הזה.</span></p>' : '')) +
    '</section>' +
    '<section class="card stack"><div><h2 class="h2">מי זמין מתי</h2><p class="sub">בכל יום, מימין לשמאל: ' + order + '. הקשה על שם פותחת את הזמינות לעריכה.</p></div>' +
    '<div class="legend"><span><i class="c c1"></i>אפשר</span><span><i class="c c2"></i>מועדף</span><span><i class="c c1 cp"></i>חלק מהמשמרת</span><span><i class="c c0"></i>לא</span><span><i class="c cq"></i>טרם הוגש</span><span><i class="c cx"></i>סגור</span></div>' +
    (emps.length ? '<div class="scroll-x"><table class="mx"><thead>' + head + '</thead><tbody>' + rows + '</tbody><tfoot>' + foot + '</tfoot></table></div>' : '<p class="sub">עוד אין עובדים. מוסיפים אותם בלשונית הצוות.</p>') +
    '</section>' +
    '<section class="card stack"><div><h2 class="h2">איפה צפוי מחסור</h2><p class="sub">משמרות שבהן מספר הזמינים לתפקיד קטן מהנדרש, עוד לפני השיבוץ.</p></div>' +
    (risks.length
      ? '<ul class="risk">' + risks.map(r => '<li><b>' + DAYS[r.d] + ' ' + esc(r.sh.name) + '</b>' + roleChip(r.roleId) + '<em>' + (r.have ? r.have + ' זמינים' : 'אין זמינים') + ' מתוך ' + r.need + ' נדרשים</em></li>').join('') + '</ul>'
      : '<p class="banner banner-ok">' + icon('check') + '<span>לכל תפקיד בכל משמרת יש מספיק זמינים.</span></p>') +
    '</section>';
}

function viewMyShifts() {
  const me = currentMe();
  const wk = ui.week, pub = state.weeks[wk].published;
  const head = '<section class="wk-head">' + weekNav() + '</section>';
  if (!pub) {
    return head + '<section class="card empty"><h1 class="h2">הסידור לשבוע הזה עוד לא פורסם</h1>' +
      '<p class="sub">כשהמנהל/ת יפרסם את הסידור, המשמרות שלך יופיעו כאן.</p>' +
      '<button type="button" class="btn" data-act="nav" data-view="my-availability">' + icon('clock') + 'עדכון הזמינות שלי</button></section>';
  }
  const start = fromKey(wk), mine = [];
  let minutes = 0;
  for (let d = 0; d < 7; d++) for (const sh of state.shifts) {
    const list = pub.slots[sk(d, sh.id)] || [];
    list.forEach(p => {
      if (p.emp !== me.id) return;
      const sp = span(d, sh.id);
      minutes += sp[1] - sp[0];
      mine.push({ d, sh, role: p.role, hours: hoursOf(wk, me.id, sk(d, sh.id)), mates: list.filter(q => q.emp && q.emp !== me.id).map(q => (empById(q.emp) || {}).name).filter(Boolean) });
    });
  }
  const hours = Math.round(minutes / 6) / 10;
  return head +
    '<section class="pagehead"><div><h1 class="h1">המשמרות של ' + esc(me.name) + '</h1><p class="sub">' +
    (mine.length ? many(mine.length, 'משמרת אחת', 'משמרות') + ' · ' + hours + ' שעות · פורסם ' + stamp(pub.at) : 'פורסם ' + stamp(pub.at)) + '</p></div>' +
    '<button type="button" class="btn" id="btnExportMine" data-act="exportMine">' + icon('down') + 'שמירת הסידור</button></section>' +
    (mine.length
      ? '<section class="list">' + mine.map(m =>
        '<article class="myshift"><div class="myshift-d"><span class="myshift-dn">' + DAYS[m.d] + '</span>' + ltr(dm(addDays(start, m.d))) + '</div>' +
        '<div class="myshift-b"><div class="myshift-t"><strong data-sn="' + m.sh.id + '">' + esc(m.sh.name) + '</strong>' + shiftTime(m.sh) + roleChip(m.role) + '</div>' +
        (m.hours ? '<span class="sub">בשעות שסימנת: ' + ltr(m.hours) + '</span>' : '') +
        (m.mates.length ? '<span class="sub">איתך במשמרת: ' + m.mates.map(esc).join(', ') + '</span>' : '') + '</div></article>').join('') + '</section>'
      : '<section class="card empty"><h2 class="h2">לא שובצת השבוע</h2><p class="sub">אין לך משמרות בסידור שפורסם לשבוע הזה.</p></section>') +
    '<details class="fold" data-fold="full"' + (ui.open.full ? ' open' : '') + '><summary>הסידור המלא של הצוות</summary><div class="stack" style="padding-top:10px">' +
    weekGrid(wk, pub.slots, { me: me.id }) + '</div></details>';
}

/* ---------- sheets ---------- */
function shareText(wk) {
  const w = state.weeks[wk], start = fromKey(wk);
  const lines = ['*סידור עבודה – ' + state.store.name + '*', 'שבוע ' + weekLabel(wk).replace('–', '-'), ''];
  for (let d = 0; d < 7; d++) {
    const part = [];
    for (const sh of state.shifts) {
      const list = w.slots[sk(d, sh.id)] || [];
      if (!list.length) continue;
      part.push(sh.name + ' (' + sh.start + '-' + sh.end + '):');
      list.forEach(p => {
        const e = p.emp && empById(p.emp), r = roleById(p.role), h = p.emp ? hoursOf(wk, p.emp, sk(d, sh.id)) : '';
        part.push('• ' + (r ? r.name : '') + ': ' + (e ? e.name : '— חסר —') + (h ? ' (' + h.replace(/–/g, '-') + ')' : ''));
      });
    }
    if (part.length) lines.push('*' + dayTitle(d) + ' ' + dm(addDays(start, d)) + '*', ...part, '');
  }
  return lines.join('\n').trim();
}
function remindText(wk) {
  return 'היי, תזכורת: עוד לא הגשתם זמינות לשבוע ' + weekLabel(wk).replace('–', '-') + ' (' + state.store.name + ').\nבבקשה להגיש בהקדם כדי שנוכל לסגור את הסידור. תודה!';
}

const SHEETS = {
  color(s) {

    return {
      title: 'שעות מסוימות',
      sub: dayTitle(u[0]) + ' · ' + esc(sh.name) + ' ' + ltr(sh.start + '–' + sh.end),
      body: '<p class="sub">אפשר לבחור עד שני טווחי שעות בתוך המשמרת. טווח שמסתיים בסוף המשמרת יתעדכן אם שעות המשמרת ישתנו.</p>' + rows +

        '<div class="seg" role="group" aria-label="סוג הזמינות"><button type="button" class="seg-b" id="trV1" data-act="trV" data-v="1" aria-pressed="' + (s.v !== 2) + '">אפשר</button>' +
        '<button type="button" class="seg-b" id="trV2" data-act="trV" data-v="2" aria-pressed="' + (s.v === 2) + '">מועדף</button></div>' +
        (s.err ? '<p class="err" role="alert">' + s.err + '</p>' : ''),
      foot: '<button type="button" class="btn btn-primary" id="trSave" data-act="trSave">שמירה</button>' +
        (s.had ? '<button type="button" class="btn" id="trFull" data-act="trFull">כל המשמרת</button>' : '') +
        '<button type="button" class="btn" data-act="close">ביטול</button>',
    };
  },
  export(s) {
    return {
      title: 'ייצוא הסידור',
      sub: 'שבוע ' + ltr(weekLabel(s.wk)) + ' · עיצוב ' + (EXPORT_STYLES.find(x => x.id === s.style) || EXPORT_STYLES[0]).name,
      body: (s.url ? '<img class="xprev" id="exportImg" src="' + s.url + '" alt="הסידור כפי שיופיע בקובץ">' : '<div class="xprev">' + (s.fail ? 'לא הצלחתי להכין את הקובץ.' : 'מכין…') + '</div>') +
        '<div class="seg" role="group" aria-label="סוג הקובץ"><button type="button" class="seg-b" id="xPdf" data-act="xFmt" data-f="pdf" aria-pressed="' + (s.fmt === 'pdf') + '">PDF</button>' +
        '<button type="button" class="seg-b" id="xJpg" data-act="xFmt" data-f="jpg" aria-pressed="' + (s.fmt === 'jpg') + '">תמונה (JPEG)</button></div>' +
        (s.draft ? '<p class="banner banner-warn">' + icon('alert') + '<span>הסידור הזה עוד לא פורסם כפי שהוא, ולכן הקובץ מסומן "טיוטה".</span></p>' : '') +
        (s.mgr ? '<p class="sub">את העיצוב של הקובץ בוחרים בהגדרות, בכרטיס "ייצוא הסידור".</p>' : ''),
      foot: '<button type="button" class="btn btn-primary" id="xSave" data-act="xSave"' + (s.blobs ? '' : ' disabled') + '>' + icon('down') + 'הורדה</button>' +
        (s.canShare ? '<button type="button" class="btn" id="xShare" data-act="xShare"' + (s.blobs ? '' : ' disabled') + '>' + icon('share') + 'שיתוף</button>' : '') +
        '<button type="button" class="btn" data-act="close">סגירה</button>',
    };
  },
  pos(s) {
    const wk = ui.week, w = state.weeks[wk], p = (w.slots[s.k] || [])[s.i];
    if (!p) return null;
    const u = unsk(s.k), d = u[0], sh = shiftById(u[1]);
    const rows = state.employees.map(e => {
      const is = issues(wk, d, sh.id, p.role, e, s);
      const av = availRec(wk, e.id);
      return { e, is, pref: !!(av && av.submittedAt && slotV(av.slots[s.k]) === 2), hours: hoursOf(wk, e.id, s.k), load: empShifts(w, e.id).length };
    });
    const cur = rows.find(r => r.e.id === p.emp);
    const rest = rows.filter(r => r.e.id !== p.emp);
    const fit = rest.filter(r => !r.is.length).sort((a, b) => (b.pref - a.pref) || (a.load / a.e.max - b.load / b.e.max));
    const stretch = rest.filter(r => r.is.length && !r.is.includes('norole') && !r.is.includes('inslot')).sort((a, b) => a.is.length - b.is.length);
    const busy = rest.filter(r => r.is.includes('inslot') && !r.is.includes('norole'));
    const norole = rest.filter(r => r.is.includes('norole'));
    const loadTxt = r => '<bdi class="t" dir="ltr">' + r.load + '/' + r.e.max + '</bdi> משמרות';
    const row = (r, kind) => {
      const sub = kind === 'fit'
        ? '<span class="cand-s' + (r.pref ? ' is-good' : '') + '">' + (r.pref ? 'מעדיף/ה את המשמרת · ' : 'זמין/ה · ') + loadTxt(r) + '</span>'
        : '<span class="cand-s is-warn">' + r.is.map(z => issueText(z, r.e, r.hours)).join(' · ') + '</span>';
      return kind === 'busy'
        ? '<div class="cand"><span class="cand-n">' + esc(r.e.name) + '</span>' + sub + '</div>'
        : '<button type="button" class="cand" data-act="assign" data-emp="' + r.e.id + '"><span class="cand-n">' + esc(r.e.name) + '</span>' + sub + '<span class="cand-go">שיבוץ</span></button>';
    };
    const group = (title, list, kind) => (list.length ? '<div class="grp"><div class="grp-h">' + title + ' (' + list.length + ')</div><div class="cands">' + list.map(r => row(r, kind)).join('') + '</div></div>' : '');
    let body = '';
    if (cur) {
      const is = cur.is.filter(z => z !== 'inslot');
      body += '<div class="grp"><div class="grp-h">משובץ/ת כעת</div><div class="cands"><div class="cand is-cur"><span class="cand-n">' + esc(cur.e.name) + '</span>' +
        '<span class="cand-s' + (is.length ? ' is-warn' : '') + '">' + (is.length ? is.map(z => issueText(z, cur.e, cur.hours)).join(' · ') : loadTxt(cur)) + '</span></div></div>' +
        '<div class="quick"><button type="button" class="chipbtn" id="posLock" data-act="lock">' + (p.lock ? 'שחרור הנעילה' : 'נעילת השיבוץ') + '</button>' +
        '<button type="button" class="chipbtn" id="posClear" data-act="unassign">הסרת השיבוץ</button>' +
        '<span class="sub">' + (p.lock ? 'נעול: שיבוץ אוטומטי לא ישנה אותו.' : 'לא נעול: שיבוץ אוטומטי עשוי לשנות אותו.') + '</span></div></div>';
    }
    if (!fit.length) body += '<p class="banner banner-warn">' + icon('alert') + '<span>אין כרגע עובד/ת זמין/ה ופנוי/ה עם התפקיד הזה. אפשר לשבץ בחריגה, או לבקש מהצוות לעדכן זמינות.</span></p>';
    body += group('מתאימים למשמרת', fit, 'fit') + group('אפשר לשבץ בחריגה', stretch, 'warn') + group('כבר במשמרת הזו', busy, 'busy');
    if (norole.length) {
      body += '<details class="fold" data-fold="norole"' + (ui.open.norole ? ' open' : '') + '><summary>עובדים שלא מוגדרים לתפקיד (' + norole.length + ')</summary><div class="cands" style="margin-top:6px">' + norole.map(r => row(r, 'warn')).join('') + '</div></details>';
    }
    body += '<div><button type="button" class="btn btn-quiet btn-danger" data-act="rmpos">' + icon('trash') + 'הסרת העמדה מהמשמרת הזו</button></div>';
    return { title: (roleById(p.role) || {}).name || 'עמדה', sub: dayTitle(d) + ' ' + ltr(dm(addDays(fromKey(wk), d))) + ' · ' + esc(sh.name) + ' ' + ltr(sh.start + '–' + sh.end), body };
  },
  addpos(s) {
    const wk = ui.week, w = state.weeks[wk], u = unsk(s.k), sh = shiftById(u[1]);
    const body = '<p class="sub">העמדה תתווסף רק למשמרת הזו, בשבוע הזה. את התקן הקבוע משנים בהגדרות.</p>' +
      '<div class="menu">' + state.roles.map(r => '<button type="button" class="menu-i" data-act="addposGo" data-role="' + r.id + '">' + icon('plus') + '<span>' + roleChip(r.id) + '</span></button>').join('') + '</div>' +
      (w.over[s.k] ? '<div><button type="button" class="btn btn-quiet" data-act="resetOver">' + icon('undo') + 'חזרה לתקן הרגיל במשמרת הזו</button></div>' : '');
    return { title: 'הוספת עמדה', sub: dayTitle(u[0]) + ' · ' + esc(sh.name), body };

let excelLoading = null;

      el.onerror = () => { excelLoading = null; reject({ code: 'lib' }); };

const cellText = c => { try { return String(c.text == null ? '' : c.text).trim(); } catch (e) { return ''; } };
// Read employee rows from a workbook: find the header row by its column titles, then one row per person.
function parseEmployees(wb) {
  const RE = { name: /שם|name/i, number: /מספר|קוד|טלפון|נייד|number|phone|code/i, roles: /תפקיד|role/i, max: /מקס|max/i };
  let found = null;
  wb.eachSheet(ws => {
    if (found) return;
    for (let r = 1; r <= Math.min(ws.rowCount, 15) && !found; r++) {
      const cols = {};
      ws.getRow(r).eachCell((c, i) => {
        const t = cellText(c);
        for (const k in RE) if (!cols[k] && RE[k].test(t) && Object.keys(cols).every(q => cols[q] !== i)) { cols[k] = i; break; }
      });
      if (cols.name && cols.number) found = { ws, head: r, cols };
    }
  });
  if (!found) { const ws = wb.worksheets[0]; if (!ws) return []; found = { ws, head: 0, cols: { name: 1, number: 2, roles: 3, max: 4 } }; }
  const ws = found.ws, cols = found.cols, out = [], seen = new Set();
  for (let r = found.head + 1; r <= ws.rowCount; r++) {
    const row = ws.getRow(r);
    const name = cellText(row.getCell(cols.name)).replace(/\s+/g, ' ');
    const number = normNum(cellText(row.getCell(cols.number)));
    if (!name && !number) continue;
    if (/דוגמה/.test(name)) continue;
    const item = { row: r, name, number, roles: null, unknown: [], max: null, err: '' };
    if (!name) item.err = 'חסר שם';
    else if (!number) item.err = 'חסר מספר אישי';
    else if (!/^\d{3,12}$/.test(number)) item.err = 'המספר האישי צריך להיות 3 עד 12 ספרות';
    else if (number === state.managerCode) item.err = 'המספר שמור לקוד המנהל/ת';
    else if (seen.has(number)) item.err = 'המספר מופיע פעמיים בקובץ';
    else seen.add(number);
    if (cols.roles) {
      const t = cellText(row.getCell(cols.roles));
      if (t) {
        item.roles = [];
        t.split(/[,;،|\n]+/).map(x => x.trim()).filter(Boolean).forEach(x => {
          const role = state.roles.find(q => normName(q.name) === normName(x));
          if (!role) item.unknown.push(x); else if (!item.roles.includes(role.id)) item.roles.push(role.id);
        });
      }
    }
    if (cols.max) { const m = parseInt(cellText(row.getCell(cols.max)), 10); if (m >= 1 && m <= 7) item.max = m; }
    out.push(item);
  }
  return out;
}
// Match file rows to the current team: by number first, then by name for people whose number changed.
function importPlan(rows) {
  const inFile = new Set(rows.filter(r => !r.err).map(r => r.number));
  const taken = new Set();
  const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  return rows.map(r => {
    if (r.err) return Object.assign({ kind: 'err', emp: null, renum: false }, r);
    let emp = state.employees.find(e => e.number === r.number) || null, renum = false;
    if (!emp) {
      emp = state.employees.find(e => normName(e.name) === normName(r.name) && !inFile.has(e.number) && !taken.has(e.id)) || null;
      renum = !!emp;
    }
    let kind = 'new';
    if (emp) {
      taken.add(emp.id);
      kind = !renum && emp.name === r.name && (!r.roles || sameSet(r.roles, emp.roles)) && (!r.max || r.max === emp.max) ? 'same' : 'upd';
    }
    return Object.assign({ kind, emp, renum }, r);
  });
}

function fitText(g, text, max) {

}

    const inp = document.getElementById('shn-' + sh.id);
    if (inp) { inp.focus(); inp.select(); }
  },
  shiftDel(ds) {
    state.shifts = state.shifts.filter(s => s.id !== ds.id);
    delete state.req[ds.id];
    for (const k in state.closed) if (unsk(k)[1] === ds.id) delete state.closed[k];
    render();
  },
  req(ds) {
    const r = state.req[ds.sh] || (state.req[ds.sh] = {});
    r[ds.role] = Math.min(9, Math.max(0, (r[ds.role] || 0) + +ds.d));
    render();
  },
  dayToggle(ds) { if (state.closed[ds.k]) delete state.closed[ds.k]; else state.closed[ds.k] = true; render(); },
  rest(ds) { state.rules.minRest = Math.min(16, Math.max(0, state.rules.minRest + +ds.d)); render(); },
  reset() {
    const manager = state.prefs.session && state.prefs.session.role === 'manager';
    state = seed();
    if (manager) state.prefs.session = { role: 'manager' };
    ui.signin = { tab: 'employee', name: '', number: '', code: '', err: '' };
    ui.codeDraft = null;
    ui.codeErr = '';
    ui.week = defaultWeek();
    autoSchedule(ui.week, false);
    ui.undo = null;
    render();
    window.scrollTo(0, 0);
    toast('נתוני הדוגמה שוחזרו.');
  },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const act = t.dataset.act;
  if (act === 'backdrop' && e.target !== t) return;
  if (act !== 'confirmAsk') ui.confirm = null;
  if (actions[act]) actions[act](t.dataset, t, e);
});
document.addEventListener('submit', e => {
  const f = e.target.dataset && e.target.dataset.form;
  if (!f) return;
  e.preventDefault();
  ui.confirm = null;
  if (actions[f]) actions[f](e.target.dataset, e.target, e);
});
document.addEventListener('input', e => {
  const t = e.target, b = t.dataset && t.dataset.bind;
  if (!b || b === 'imp.remove') return;
  const v = t.value, id = t.dataset.id;
  const paint = (attr, text) => document.querySelectorAll('[' + attr + '="' + id + '"]').forEach(n => { n.textContent = text; });
  if (b.slice(0, 3) === 'si.') { ui.signin[b.slice(3)] = v; return; }
  if (b.slice(0, 3) === 'su.') { ui.setup[b.slice(3)] = v; return; }
  if (b === 'code.draft') { ui.codeDraft = v; return; }
  if (b === 'theme.custom') { state.theme = { preset: 'custom', custom: v }; applyTheme(); save(); return; }
  if (b.slice(0, 3) === 'tr.') { const q = b.split('.'); if (ui.sheet && ui.sheet.ranges) ui.sheet.ranges[+q[1]][+q[2]] = v; return; }
  if (b.slice(0, 3) === 'dl.') return;
  if (b === 'draft.name' || b === 'draft.number') { if (ui.sheet && ui.sheet.draft) ui.sheet.draft[b.slice(6)] = v; return; }
  if (b === 'store.name') { state.store.name = v; $('#storeName').textContent = v; }
  else if (b === 'role.name') { roleById(id).name = v; paint('data-rn', v || 'ללא שם'); }
  else if (b === 'shift.name') { shiftById(id).name = v; paint('data-sn', v); }
  else if (b === 'shift.start' || b === 'shift.end') { if (!v) return; const sh = shiftById(id); sh[b.slice(6)] = v; paint('data-st', sh.start + '–' + sh.end); }
  else if (b === 'note') availRec(ui.week, id, true).note = v;
  save();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'xlsxFile') { if (t.files && t.files[0]) importFile(t.files[0]); return; }
  if (t.id === 'logoFile') { if (t.files && t.files[0]) uploadLogo(t.files[0]); return; }
  const b = t.dataset && t.dataset.bind;
  if (b === 'imp.remove' && ui.sheet) { ui.sheet.remove = t.checked; render(); return; }
  if (b === 'theme.custom') { render(); return; }
  if (b && b.slice(0, 3) === 'dl.') {
    const dl = state.rules.deadline || (state.rules.deadline = DEF_DEADLINE());
    if (b === 'dl.on') dl.on = t.checked;
    else if (b === 'dl.day') dl.day = +t.value;
    else if (b === 'dl.time' && t.value) dl.time = t.value;
    dl.tz = tzNow();
    render();
  }
});
document.addEventListener('toggle', e => {
  const f = e.target.dataset && e.target.dataset.fold;
  if (f) ui.open[f] = e.target.open;
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) closeSheet(); });
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1), sess = state.prefs.session;
  if (sess && VIEWS[h] && VIEWS[h].mode === sess.role && h !== ui.view) { ui.view = h; ui.sheet = null; render(); }
});

/* ---------- boot ---------- */
function installAppMeta() {
  const add = (tag, attrs) => { const el = document.createElement(tag); for (const k in attrs) el.setAttribute(k, attrs[k]); document.head.appendChild(el); };
  add('link', { rel: 'manifest', href: 'manifest.webmanifest' });
  add('link', { rel: 'icon', type: 'image/png', href: 'icon-192.png' });
  add('link', { rel: 'apple-touch-icon', href: 'icon-192.png' });
  add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
  add('meta', { name: 'apple-mobile-web-app-title', content: 'סדרן' });
}
applyAppearance();
if (REMOTE) {
  installAppMeta();
  swRegistration().catch(() => { /* notifications stay off on this browser */ });
  setInterval(() => { if (document.visibilityState === 'visible') refresh(false); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(false); else flushAll(true); });
  window.addEventListener('pagehide', () => flushAll(true));
  window.addEventListener('online', () => { if (net.failures) { net.failures = 0; queueChanges(); } });
  remoteStart();
} else {
  const h = location.hash.slice(1), sess = state.prefs.session;
  ui.view = sess && VIEWS[h] && VIEWS[h].mode === sess.role ? h : (sess && sess.role === 'employee' ? 'my-availability' : 'schedule');
  if (firstRun) autoSchedule(ui.week, false);   // the example opens on a proposed roster rather than an empty sheet
  render();
}
})();
</script>

</body></html>
